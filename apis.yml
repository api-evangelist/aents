name: AENTS
image: https://aents.co/og-default.png
description: >-
  AENTS (엔츠) is a Seoul, South Korea climate-technology company founded in 2021 by CEO Gwangbeen
  Park and CTO Chongsoo Jung. Its product is AENTSCOPE (엔스코프), an enterprise carbon-management
  and carbon-accounting SaaS platform — described by the company as the first of its kind in
  Korea, launched in early 2022 — that lets a corporation build a greenhouse-gas inventory,
  automate Scope 1, 2 and 3 emissions calculation, run third-party verification, and produce
  disclosure reports aligned to KSSB, IFRS S2, CSRD, GRI, ISSB and CDP, alongside product carbon
  footprint (PCF/LCA), CBAM, climate physical-risk analysis and a supplier portal for Scope 3
  value-chain data. AENTS pairs the platform with a climate-expert ESG consulting practice, and
  publishes a Korean-language blog, newsletter and a free corporate emissions calculator. Named
  customers include JYP, Nongshim, Woosung and Hansalim. The company raised a Series A led by
  Envisioning Partners in February 2023 and is also a Mashup Ventures portfolio company. AENTSCOPE
  is an API CONSUMER rather than an API producer: the company markets automated data collection
  through connections to external systems — the Korea Electric Power Corporation (한국전력/KEPCO)
  API, the Allbaro (올바로) national waste-management API, and customer ERP systems including SAP
  and Douzone — but publishes no public API, developer portal, OpenAPI, SDK or webhook surface of
  its own.
