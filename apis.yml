  state: none
  reason: no-developer-program
  detail: >-
    AENTS sells AENTSCOPE as a tenant SaaS and an ESG consulting engagement, and its
    integration story runs INWARD — the platform consumes the KEPCO (한국전력) and Allbaro
    (올바로) APIs and customer ERP systems to collect activity data — so the company
    publishes no API of its own: /openapi.json, /swagger.json, /graphql, /llms.txt,
    /apis.json and every /.well-known/ path return the site's own 404 page on both
    aents.co and www.aentscope.com, the only docs host (docs.aentscope.com, a GitBook
    space that historically served company PDFs) answers HTTP 401 on every path
    including a negative control, and the company GitHub org github.com/AENTS holds one
    public repository which is a front-end hiring assignment, not API code.
